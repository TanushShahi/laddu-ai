<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="arcGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="1"/>
      <stop offset="60%" stop-color="#0077ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#070b14" stop-opacity="1"/>
    </radialGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#070b14"/>
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="#00f0ff" stroke-width="4" stroke-opacity="0.5"/>

  <!-- Outer Reactor Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00f0ff" stroke-width="8" stroke-dasharray="25 15" filter="url(#neonBlur)"/>
  
  <!-- Mid Tech Ring -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="#00d4ff" stroke-width="5" stroke-opacity="0.7"/>

  <!-- Inner Glowing Core -->
  <circle cx="256" cy="256" r="80" fill="url(#arcGlow)" filter="url(#neonBlur)"/>
  <circle cx="256" cy="256" r="45" fill="#ffffff" opacity="0.9"/>

  <!-- Core Letter "L" for LADDU -->
  <text x="256" y="278" font-family="'Orbitron', sans-serif" font-size="64" font-weight="900" fill="#070b14" text-anchor="middle">L</text>
</svg>
